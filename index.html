<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Profile</title>
  <meta name="description" content="A static web profile with a business-card profile and project details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260426">
</head>
<body>
  <main class="page-shell">
    <section class="hero-copy">
      <p class="eyebrow" data-profile="eyebrow"></p>
      <h1 data-profile="englishName"></h1>
      <p class="subtitle" data-profile="subtitle"></p>
    </section>

    <section class="card-stage" data-ui-aria="aria.cardStage">
      <button
        class="card-flip-button"
        id="business-card"
        type="button"
        aria-pressed="false"
        data-ui-aria="aria.cardFlip"
      >
        <span class="card-flip-inner">
          <span class="card-face card-front">
            <span class="card-flip-icon" aria-hidden="true">&#8635;</span>
            <span class="card-front-layout">
              <span class="profile-panel">
                <span class="profile-photo" id="profile-photo" aria-hidden="true"></span>
              </span>

              <span class="card-content">
                <span class="name-block">
                  <strong data-profile="name"></strong>
                  <span class="english-name" data-profile="englishName"></span>
                </span>

                <span class="info-list">
                  <span class="info-row">
                    <span class="info-label" data-ui="labels.email"></span>
                    <span class="info-value" data-profile="contact.email"></span>
                  </span>
                  <span class="info-row">
                    <span class="info-label" data-ui="labels.phone"></span>
                    <span class="info-value" data-profile="contact.phone"></span>
                  </span>
                </span>
              </span>
            </span>

            <span class="tap-hint" data-profile="frontBadge"></span>
          </span>

          <span class="card-face card-back">
            <span class="back-copy">
              <strong data-profile="back.title"></strong>
              <p data-profile="back.description"></p>
            </span>
            <span class="back-placeholder" data-profile="back.badge"></span>
          </span>
        </span>
      </button>
    </section>

    <section class="projects-section" aria-labelledby="projects-title">
      <div class="section-heading">
        <p class="section-eyebrow" data-ui="sections.projectsEyebrow"></p>
        <h2 id="projects-title" data-ui="sections.projectsTitle"></h2>
      </div>

      <div class="projects-grid" id="projects-grid"></div>
    </section>
  </main>

  <div class="project-overlay" id="project-overlay" aria-hidden="true">
    <section
      class="project-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="project-detail-title"
      tabindex="-1"
    >
      <div class="project-panel-top">
        <p class="project-detail-eyebrow" id="project-detail-eyebrow"></p>
        <button class="icon-button" type="button" data-project-close data-ui-aria="aria.projectClose">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="project-detail-layout">
        <div class="project-detail-preview" id="project-detail-preview" aria-hidden="true"></div>

        <div class="project-detail-copy">
          <h2 id="project-detail-title"></h2>
          <p id="project-detail-summary"></p>

          <dl class="project-meta">
            <div>
              <dt data-ui="labels.role"></dt>
              <dd id="project-detail-role"></dd>
            </div>
            <div>
              <dt data-ui="labels.result"></dt>
              <dd id="project-detail-result"></dd>
            </div>
          </dl>

          <div class="detail-section">
            <h3 data-ui="sections.featuresTitle"></h3>
            <ul class="feature-list" id="project-detail-features"></ul>
          </div>

          <div class="detail-section">
            <h3 data-ui="sections.techTitle"></h3>
            <div class="tech-list" id="project-detail-tech"></div>
          </div>
        </div>
      </div>

      <div class="project-actions" id="project-actions">
        <a class="primary-action" id="project-detail-link" href="#" target="_blank" rel="noreferrer" data-ui="actions.projectLink"></a>
      </div>
    </section>
  </div>

  <script src="./data.js?v=20260426"></script>
  <script src="./script.js?v=20260426"></script>
</body>
</html>
